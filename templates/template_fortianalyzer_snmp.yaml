zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 36a6356a22714fc3ab8ab859996493ef
      template: 'FortiAnalyzer by SNMP'
      name: 'FortiAnalyzer by SNMP'
      description: |
        Template for monitoring Fortinet FortiAnalyzer appliances through SNMP.
        
        Designed and tested with:
        - Zabbix 7.0
        - FortiAnalyzer VM64 v7.6.7 build 3737
        - SNMPv3 authPriv
        
        The template uses numeric OIDs and does not require Fortinet MIB files on the Zabbix server.
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: af599820e36242a3ba3110e9e3115181
          name: 'ADOM: Number of administrative domains'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.5.1.2.0
          key: faz.adom.count
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Number of administrative domains currently present on the FortiAnalyzer.'
          tags:
            - tag: component
              value: adom
        - uuid: 9f007116e0504fc69b32ea71984ceec3
          name: 'ADOM: Enabled state'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.5.1.1.0
          key: faz.adom.enabled
          delay: 5m
          history: 7d
          trends: 90d
          description: 'Indicates whether Administrative Domains are enabled on the FortiAnalyzer.'
          tags:
            - tag: component
              value: adom
        - uuid: d6d3d5f9da784497a869f465504d54b7
          name: 'ADOM: Maximum number of administrative domains'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12356.103.5.1.3.0
          key: faz.adom.max
          delay: 1h
