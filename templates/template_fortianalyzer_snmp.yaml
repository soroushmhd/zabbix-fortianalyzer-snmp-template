          key: faz.adom.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#ADOM.DEVICES}'
                value: '^[1-9][0-9]*$'
                formulaid: A
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          item_prototypes:
